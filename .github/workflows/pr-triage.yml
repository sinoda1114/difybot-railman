# PR Bot コメント仕分けの呼び出し側（実体: https://github.com/sinoda1114/ci-standard）
# このファイルを対象リポジトリの .github/workflows/pr-triage.yml に置く。
# 必要な Secret: TYPESAFE_API_KEY（無くても動くが、JEV なしの粗い束ね方になる）
#
# 動き: AI レビューボットが PR にレビューを投稿するたび（と人がスレッドを解決/再開したとき）に起動し、3 分待って（Bot が出そろうのを待つ）
#       スレッドを「同じ問題」で束ね種別順に並べた表を、PR の固定コメントとして投稿・更新する。
#       正誤の判定はしない。人か Claude がグループ単位で判断する。

name: PR triage

on:
  pull_request_review:
    types: [submitted]
  # 人がスレッドを解決/再開したときも表を作り直す（解決済みは表から外れる。Bot の新しいレビューが無くても古い表を残さない）
  pull_request_review_thread:
    types: [resolved, unresolved]

# 同じ PR で新しいレビューが来たら、待機中の旧ジョブを打ち切って最後の 1 回だけ集計する
concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    # Bot のレビューだけを対象にする（人のレビューでは起動しない）。fork からの PR は投稿権限が無いので起動しない
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name == 'pull_request_review_thread' ||
      endsWith(github.event.review.user.login, '[bot]') ||
      contains(fromJSON('["cursor","devin-ai-integration","copilot-pull-request-reviewer","chatgpt-codex-connector","amazon-q-developer"]'), github.event.review.user.login))
    # @main 参照は意図的（標準CIと同じ）。ci-standard は同一オーナーの標準リポジトリ（main は PR 経由・self-test 必須）で、
    # SHA 固定にすると sweeper が毎日全リポジトリを書き換えることになる。ci-standard 側で第三者 Action は SHA 固定している
    uses: sinoda1114/ci-standard/.github/workflows/pr-triage.yml@main
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
